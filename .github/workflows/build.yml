name: Build R36 GENRA (ARM64)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kurztest am PC (ohne Bildschirm)
        run: |
          make test
          ls -la testausgabe

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Altes Ubuntu (glibc 2.27), damit das Programm auf ArkOS und dArkOS laeuft
      - name: Bauen fuer ARM64
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src ubuntu:18.04 bash -c \
            "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends g++ make libsdl2-dev >/dev/null && make clean && make r36genra && strip r36genra && file r36genra || true"
          ls -la r36genra

      - name: Paket zusammenstellen
        run: |
          mkdir -p paket/ports/r36genra/samples/{kick,clap,hat,perc,keys}
          cp r36genra paket/ports/r36genra/
          cp "port/R36 GENRA.sh" paket/ports/
          cp LICENSE paket/ports/r36genra/
          cp docs/ANLEITUNG.md paket/ports/r36genra/ANLEITUNG.txt
          for d in kick clap hat perc keys; do echo "Eigene WAV-Dateien hier ablegen." > paket/ports/r36genra/samples/$d/HIER_WAVS.txt; done

      - uses: actions/upload-artifact@v4
        with:
          name: R36-GENRA-ports
          path: paket/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Testbilder
          path: testausgabe/*.ppm
          retention-days: 7
